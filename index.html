<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Jornada Especial</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="jogo-container">
        
        <div id="tela-inicio">
            <div class="menu-conteudo">
                <h1 class="titulo-jogo">UMA JORNADA<br>ESPECIAL</h1>
                <p class="subtitulo-jogo">Um pequeno presente em pixel art</p>
                <button id="btn-iniciar">INICIAR JORNADA</button>
            </div>
        </div>

        <div id="tela-final-creditos" style="display: none;">
            <div id="texto-agradecimento"></div>
            <button id="btn-reiniciar">JOGAR NOVAMENTE</button>
        </div>

        <p id="texto-objetivo">Carregando jornada...</p>

        <canvas id="gameCanvas" width="800" height="450"></canvas>
        
        <div id="legendas-container" style="display: none;">
            <p id="texto-legenda"></p>
        </div>

        <div id="hud-texto" style="display: none;">
            <div id="texto-caixa"></div>
            <button id="btn-proximo">Próximo</button>
        </div>

        <div id="hud-carta">
            <div id="pergaminho-container">
                <div id="papel-fechado" title="Clique para abrir!"></div>
            </div>

            <div id="carta-aberta">
                <div class="carta-pergaminho">
                    <div id="texto-carta-conteudo" class="texto-carta-real"></div>
                    <button id="btn-fechar-carta">Guardar no Coração</button>
                </div>
            </div>
        </div>

        <div id="controles-mobile">
            <button class="btn-touch" id="touch-up">▲</button>
            <button class="btn-touch" id="touch-left">◀</button>
            <button class="btn-touch" id="touch-right">▶</button>
            <button class="btn-touch" id="touch-down">▼</button>
        </div>

    </div>

    <script src="boneco.js"></script>
    <script src="cenario.js"></script>
    <script src="script.js"></script>
    <script src="introduçao.js"></script> 
</body>
</html>
